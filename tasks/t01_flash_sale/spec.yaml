id: t01_flash_sale
title: Flash-sale stock decrement
entrypoint: purchase
signature: "purchase(db, product_id: int, qty: int) -> bool"

invariants:                       # checked after every schedule of every scenario
  - name: stock never negative
    sql: SELECT bool_and(stock >= 0) FROM products

solo_checks:
  - name: enough stock succeeds
    seed_sql: INSERT INTO products VALUES (1, 5);
    call: {product_id: 1, qty: 3}
    expect_return: true
    expect_sql: >
      SELECT p.stock = 2 AND o.n = 1 AND o.total = 3
      FROM products p, (SELECT count(*) AS n, sum(qty) AS total FROM orders WHERE product_id = 1) o
      WHERE p.id = 1
  - name: buying exactly the remaining stock succeeds
    seed_sql: INSERT INTO products VALUES (1, 3);
    call: {product_id: 1, qty: 3}
    expect_return: true
    expect_sql: SELECT stock = 0 AND (SELECT count(*) = 1 FROM orders) FROM products WHERE id = 1
  - name: not enough stock is refused cleanly
    seed_sql: INSERT INTO products VALUES (1, 2);
    call: {product_id: 1, qty: 3}
    expect_return: false          # raising an exception here is a FAIL
    expect_sql: SELECT stock = 2 AND NOT EXISTS (SELECT 1 FROM orders) FROM products WHERE id = 1

concurrent_scenarios:
  - name: two buyers, only one can win
    seed_sql: INSERT INTO products VALUES (1, 5);
    requests:
      - {product_id: 1, qty: 3}
      - {product_id: 1, qty: 3}
    must_all_succeed: false       # safety only
    invariants:
      - name: stock is conserved (started at 5)
        sql: >
          SELECT p.stock + COALESCE((SELECT sum(qty) FROM orders WHERE product_id = p.id), 0) = 5
          FROM products p WHERE p.id = 1
  - name: two buyers, both fit
    seed_sql: INSERT INTO products VALUES (1, 6);
    requests:
      - {product_id: 1, qty: 3}
      - {product_id: 1, qty: 3}
    must_all_succeed: true        # both must return True in every schedule
    invariants:
      - name: stock is conserved (started at 6)
        sql: >
          SELECT p.stock + COALESCE((SELECT sum(qty) FROM orders WHERE product_id = p.id), 0) = 6
          FROM products p WHERE p.id = 1
