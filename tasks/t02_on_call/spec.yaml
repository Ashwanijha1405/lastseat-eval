id: t02_on_call
title: Hospital on-call rota
entrypoint: go_off_call
signature: "go_off_call(db, doctor_id: int) -> bool"

invariants:
  - name: every shift has at least one doctor on call
    sql: >
      SELECT bool_and(n >= 1) FROM (
        SELECT count(d.id) FILTER (WHERE d.on_call) AS n
        FROM shifts s LEFT JOIN doctors d ON d.shift_id = s.id
        GROUP BY s.id
      ) per_shift

solo_checks:
  - name: leaving while a colleague stays on call succeeds
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 1, true);
    call: {doctor_id: 1}
    expect_return: true
    expect_sql: SELECT array_agg(on_call ORDER BY id) = '{f,t}' FROM doctors
  - name: last doctor on call is refused cleanly
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 1, false);
    call: {doctor_id: 1}
    expect_return: false
    expect_sql: SELECT array_agg(on_call ORDER BY id) = '{t,f}' FROM doctors
  - name: doctors on call in other shifts do not count
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night'), (2, 'day');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 2, true);
    call: {doctor_id: 1}
    expect_return: false
    expect_sql: SELECT array_agg(on_call ORDER BY id) = '{t,t}' FROM doctors

concurrent_scenarios:
  - name: two on call, both ask to leave
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 1, true);
    requests:
      - {doctor_id: 1}
      - {doctor_id: 2}
    must_all_succeed: false
  - name: three on call, two ask to leave
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 1, true), (3, 'Chen', 1, true);
    requests:
      - {doctor_id: 1}
      - {doctor_id: 2}
    must_all_succeed: true
    invariants:
      - name: Chen is still on call
        sql: SELECT on_call FROM doctors WHERE id = 3
  - name: one leaves from each of two shifts
    seed_sql: |
      INSERT INTO shifts VALUES (1, 'night'), (2, 'day');
      INSERT INTO doctors VALUES (1, 'Alice', 1, true), (2, 'Bob', 1, true),
                                 (3, 'Chen', 2, true), (4, 'Dana', 2, true);
    requests:
      - {doctor_id: 1}
      - {doctor_id: 3}
    must_all_succeed: true
    invariants:
      - name: Bob and Dana are still on call
        sql: SELECT bool_and(on_call) FROM doctors WHERE id IN (2, 4)
